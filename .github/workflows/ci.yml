name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate plugin manifest JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf-8'))"
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf-8'))"
          node -e "JSON.parse(require('fs').readFileSync('.mcp.json','utf-8'))"
          node -e "JSON.parse(require('fs').readFileSync('mcp-server/package.json','utf-8'))"
      - name: Verify version sync (plugin.json ↔ mcp-server/package.json)
        run: |
          PLUGIN_V=$(node -p "require('./.claude-plugin/plugin.json').version")
          NPM_V=$(node -p "require('./mcp-server/package.json').version")
          if [ "$PLUGIN_V" != "$NPM_V" ]; then
            echo "::error::version drift: plugin.json=$PLUGIN_V mcp-server/package.json=$NPM_V"
            exit 1
          fi
          echo "✓ versions match: $PLUGIN_V"
      - name: Parse-check server.js
        run: node --check mcp-server/server.js
      - name: Run smoke tests
        working-directory: mcp-server
        run: node --test test.js

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        working-directory: mcp-server
        run: docker build -t acp-find-mcp:ci .
      - name: Smoke-run image (initialize handshake only)
        run: |
          # Send a single initialize request through stdio. Image should reply
          # with a valid JSON-RPC response and exit cleanly when stdin closes.
          OUT=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.1"}}}' \
            | docker run --rm -i acp-find-mcp:ci 2>/dev/null | head -1)
          echo "$OUT"
          echo "$OUT" | node -e "
            const r = JSON.parse(require('fs').readFileSync(0,'utf-8'));
            if (r.result.serverInfo.name !== 'acp-find') process.exit(1);
            if (r.result.protocolVersion !== '2025-11-25') process.exit(1);
          "
